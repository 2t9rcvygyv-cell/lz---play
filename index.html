
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101923">
<title>IZ PLAY 3D Battle Royale</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#101923;color:white;font-family:Arial;overflow:hidden}
body{overscroll-behavior:none}
#game{position:fixed;inset:0;z-index:0}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* Lobby có vùng cuộn riêng để Safari iPhone vuốt được */
#lobby{
 position:fixed;inset:0;z-index:5;
 background:linear-gradient(90deg,#08121bdd,#08121d55),linear-gradient(#0002,#0008);
 display:flex;flex-direction:column;justify-content:space-between;
 gap:clamp(22px,5vh,48px);
 padding:max(18px,env(safe-area-inset-top)) 5% max(24px,env(safe-area-inset-bottom));
 overflow-y:auto;overflow-x:hidden;
 -webkit-overflow-scrolling:touch;
 overscroll-behavior-y:contain;
 touch-action:pan-y;
}
#lobby *{touch-action:pan-y}
#lobby button,#lobby select{touch-action:manipulation}
.top,.middle,.bottom{flex-shrink:0}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:1000;letter-spacing:3px;color:#ffd45b}
.tag{font-size:11px;color:#c7d3df;letter-spacing:2px}
.middle{text-align:left;max-width:430px}
.middle h1{font-size:clamp(35px,7vw,65px);margin:5px 0}
.middle p{color:#c1d0dc}
.bottom{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.menu{display:flex;gap:8px;flex-wrap:wrap}
.menu button,.action{
 background:#1a2b3ccc;border:1px solid #ffffff44;color:white;
 border-radius:10px;padding:13px;font-weight:bold
}
.action{background:linear-gradient(90deg,#ffbb36,#ec542f);border:0;padding:17px 32px;font-size:18px}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}
.stat{position:absolute;top:12px;background:#08121dcc;border:1px solid #ffffff44;padding:10px;border-radius:10px;font-weight:bold}
#health{left:12px}#count{right:12px}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:27px}
#joystick{position:absolute;left:20px;bottom:22px;width:120px;height:120px;border-radius:50%;background:#ffffff24;border:2px solid #ffffff70;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:48px;height:48px;left:34px;top:34px;border-radius:50%;background:#ffffffbb;pointer-events:none}
#buttons{position:absolute;right:20px;bottom:25px;display:flex;gap:12px;align-items:end;pointer-events:auto}
#fire,#reload{border:2px solid #fff;border-radius:50%;color:white;font-weight:bold;touch-action:none}
#fire{width:82px;height:82px;background:#e74a38;font-size:17px}
#reload{width:58px;height:58px;background:#263d55}
#rotate{position:fixed;inset:0;background:#08121d;color:white;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px}
#notice{position:absolute;top:65px;width:100%;text-align:center;text-shadow:0 2px 5px black}
@media(orientation:portrait){#rotate{display:flex}}
@media(orientation:landscape){#rotate{display:none}}
@media(orientation:landscape) and (max-height:500px){
 #lobby{justify-content:flex-start;gap:22px}
 .middle h1{font-size:clamp(34px,7vw,52px)}
 .bottom{padding-bottom:8px}
}
</style>
</head>
<body>

<div id="game"></div>
<div id="rotate"><div>📱<br><br>Hãy xoay điện thoại nằm ngang để chơi IZ PLAY</div></div>

<div id="lobby">
 <div class="top">
  <div><div class="logo">ｌｚ PLAY</div><div class="tag">3D BATTLE ROYALE</div></div>
  <div>👤 PLAYER<br><small>LEVEL 1</small></div>
 </div>
 <div class="middle">
  <div class="tag">WELCOME TO THE BATTLEFIELD</div>
  <h1>READY TO<br>FIGHT?</h1>
  <p>Chiến đấu • Sinh tồn • Chiến thắng</p>
  <p>👥 Tối đa 50 nhân vật<br>🤖 Người chơi + Bot</p>
  <select id="map" style="background:#182b3d;color:white;padding:10px;border-radius:8px">
   <option value="island">🏝️ Đảo sinh tồn</option>
   <option value="desert">🏜️ Sa mạc</option>
   <option value="snow">❄️ Núi tuyết</option>
  </select>
 </div>
 <div class="bottom">
  <div class="menu">
   <button onclick="alert('Kho đồ sẽ được cập nhật ở phiên bản tiếp theo!')">🎒 KHO ĐỒ</button>
   <button onclick="alert('Nhân vật sẽ được cập nhật!')">🧍 NHÂN VẬT</button>
  </div>
  <button class="action" id="start">BẮT ĐẦU ▶</button>
 </div>
</div>

<div id="hud">
 <div class="stat" id="health">❤️ 100</div>
 <div class="stat" id="count">👥 50</div>
 <div id="cross">＋</div>
 <div id="notice"></div>
 <div id="joystick"><div id="knob"></div></div>
 <div id="buttons"><button id="reload">↻</button><button id="fire">BẮN</button></div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.getElementById("game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bc3dc);
scene.fog=new THREE.Fog(0x8bc3dc,55,180);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x52664a,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(40,70,30);
sun.castShadow=true;
scene.add(sun);

let player,bots=[],bullets=[];
let playing=false,hp=100,kills=0,ammo=30;
let yaw=0,pitch=.25,moveX=0,moveY=0;
let lastShot=0,zone=95;
let mapType="island";
const clock=new THREE.Clock();
const raycaster=new THREE.Raycaster();

function mat(color){return new THREE.MeshStandardMaterial({color,roughness:.85})}

function ground(){
 const colors={island:0x527c48,desert:0xb59a67,snow:0xd8e4eb};
 scene.background=new THREE.Color(mapType==="snow"?0x9eafc5:mapType==="desert"?0xe5b97b:0x8bc3dc);
 scene.fog.color.copy(scene.background);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(250,250),mat(colors[mapType]));
 g.rotation.x=-Math.PI/2;
 g.receiveShadow=true;
 scene.add(g);
}

function makeCharacter(color){
 const group=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.85,4,8),mat(color));
 body.position.y=1.15;
 body.castShadow=true;
 group.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),mat(0xe5bd99));
 head.position.y=2;
 head.castShadow=true;
 group.add(head);
 const gun=new THREE.Mesh(new THREE.BoxGeometry(.16,.17,1.15),mat(0x222831));
 gun.position.set(.55,1.35,-.45);
 group.add(gun);
 return group;
}

function addWorld(){
 const colors={island:[0x397b42,0x6e4e32],desert:[0xb58b50,0x776047],snow:[0xc7dce9,0x687989]};
 let treeMat=mat(colors[mapType][0]);
 let trunkMat=mat(colors[mapType][1]);
 for(let i=0;i<65;i++){
  let x=Math.random()*190-95;
  let z=Math.random()*190-95;
  if(Math.hypot(x,z)<12)continue;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,7),trunkMat);
  trunk.position.set(x,1,z);
  trunk.castShadow=true;
  scene.add(trunk);
  const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.8,4,7),treeMat);
  leaves.position.set(x,3.6,z);
  leaves.castShadow=true;
  scene.add(leaves);
 }
 for(let i=0;i<15;i++){
  let x=Math.random()*150-75;
  let z=Math.random()*150-75;
  const building=new THREE.Mesh(new THREE.BoxGeometry(7,4,7),mat(0x9c927e));
  building.position.set(x,2,z);
  building.castShadow=true;
  building.receiveShadow=true;
  scene.add(building);
 }
}

function reset(){
 // Xóa thế giới cũ, giữ lại ánh sáng hiện có
 const keep=new Set([sun]);
 for(const child of [...scene.children]){
  if(!keep.has(child))scene.remove(child);
 }
 scene.add(new THREE.HemisphereLight(0xffffff,0x52664a,2));
 bots=[];bullets=[];
 hp=100;kills=0;ammo=30;zone=95;
 mapType=document.getElementById("map").value;
 ground();addWorld();
 player=makeCharacter(0x268cff);
 player.position.set(0,0,0);
 scene.add(player);
 // 49 bot + 1 người chơi
 for(let i=0;i<49;i++){
  let b=makeCharacter([0xc54c3e,0x8c52c7,0x4c927b][i%3]);
  let a=Math.random()*Math.PI*2;
  let d=20+Math.random()*65;
  b.position.set(Math.cos(a)*d,0,Math.sin(a)*d);
  b.userData.hp=100;
  b.userData.speed=.025+Math.random()*.025;
  b.userData.cool=Math.random()*100;
  b.userData.ai=Math.random()*6;
  scene.add(b);bots.push(b);
 }
 updateHUD();
}

function updateHUD(){
 document.getElementById("health").textContent="❤️ "+Math.max(0,Math.ceil(hp))+" | 🔫 "+ammo;
 document.getElementById("count").textContent="👥 "+(bots.length+1)+" | ☠️ "+kills;
}

function start(){
 if(innerWidth<innerHeight){
  alert("Hãy xoay iPhone nằm ngang rồi bắt đầu!");
  return;
 }
 try{
  if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
  if(screen.orientation?.lock)screen.orientation.lock("landscape").catch(()=>{});
 }catch(e){}
 reset();
 document.getElementById("lobby").style.display="none";
 document.getElementById("hud").style.display="block";
 playing=true;
 document.getElementById("notice").textContent="BẮT ĐẦU SINH TỒN!";
}

function shoot(){
 if(!playing||ammo<=0||Date.now()-lastShot<260)return;
 lastShot=Date.now();ammo--;
 const origin=new THREE.Vector3();
 camera.getWorldPosition(origin);
 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);
 raycaster.set(origin,direction);
 const hits=raycaster.intersectObjects(bots.flatMap(b=>b.children),true);
 if(hits.length){
  let obj=hits[0].object;
  let target=bots.find(b=>b===obj||b.children.includes(obj)||b.getObjectById(obj.id));
  if(target){
   target.userData.hp-=35;
   if(target.userData.hp<=0){
    scene.remove(target);
    bots=bots.filter(b=>b!==target);
    kills++;
   }
  }
 }
 updateHUD();
}

function reload(){
 if(ammo===30)return;
 document.getElementById("reload").textContent="...";
 setTimeout(()=>{
  ammo=30;
  document.getElementById("reload").textContent="↻";
  updateHUD();
 },1200);
}

function update(dt){
 if(!playing)return;
 let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 let right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 player.position.addScaledVector(forward,-moveY*7*dt);
 player.position.addScaledVector(right,moveX*7*dt);
 player.rotation.y=yaw;
 let back=new THREE.Vector3(Math.sin(yaw)*9,4+pitch*5,Math.cos(yaw)*9);
 camera.position.lerp(player.position.clone().add(back),.13);
 camera.lookAt(player.position.x,player.position.y+1.7,player.position.z);

 bots.forEach(b=>{
  let dx=player.position.x-b.position.x;
  let dz=player.position.z-b.position.z;
  let d=Math.hypot(dx,dz);
  b.userData.cool-=dt;
  if(d>5&&d<65){
   b.position.x+=dx/d*b.userData.speed*60*dt;
   b.position.z+=dz/d*b.userData.speed*60*dt;
   b.rotation.y=Math.atan2(-dx,-dz);
  }
  if(d<13&&b.userData.cool<=0){hp-=2;b.userData.cool=1.2}
  if(b.position.distanceTo(player.position)>110){
   b.userData.ai+=dt;
   b.position.x+=Math.sin(b.userData.ai)*.3*dt;
  }
 });
 zone=Math.max(20,zone-.002*dt);
 if(Math.hypot(player.position.x,player.position.z)>zone)hp-=dt*3;
 updateHUD();
 if(hp<=0)end(false);
 if(bots.length===0)end(true);
}

function end(win){
 playing=false;
 document.getElementById("hud").style.display="none";
 document.getElementById("lobby").style.display="flex";
 document.querySelector(".middle h1").textContent=win?"BOOYAH!":"BẠN ĐÃ BỊ LOẠI";
 document.querySelector(".middle p").textContent="Bạn đã hạ "+kills+" đối thủ";
 document.getElementById("start").textContent="CHƠI LẠI";
}

function loop(){
 requestAnimationFrame(loop);
 let dt=Math.min(clock.getDelta(),.04);
 update(dt);
 renderer.render(scene,camera);
}
loop();

document.getElementById("start").onclick=start;
document.getElementById("fire").addEventListener("pointerdown",e=>{e.preventDefault();shoot()});
document.getElementById("reload").onclick=reload;

// Joystick
const joy=document.getElementById("joystick");
const knob=document.getElementById("knob");
let joyOn=false;
joy.addEventListener("pointerdown",e=>{
 joyOn=true;joy.setPointerCapture(e.pointerId);
 joystickMove(e);
});
joy.addEventListener("pointermove",e=>{if(joyOn)joystickMove(e)});
function joystickMove(e){
 let r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 let d=Math.hypot(x,y),m=35;
 if(d>m){x=x/d*m;y=y/d*m}
 moveX=x/m;moveY=y/m;
 knob.style.left=34+x+"px";
 knob.style.top=34+y+"px";
}
function stopJoy(){
 joyOn=false;moveX=0;moveY=0;
 knob.style.left="34px";
 knob.style.top="34px";
}
joy.addEventListener("pointerup",stopJoy);
joy.addEventListener("pointercancel",stopJoy);

// Vuốt bên phải để xoay camera
let lookOn=false,lastX=0,lastY=0;
renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.clientX>innerWidth*.4){
  lookOn=true;lastX=e.clientX;lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
 }
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(!lookOn||!playing)return;
 yaw-=(e.clientX-lastX)*.006;
 pitch=Math.max(-.2,Math.min(.8,pitch+(e.clientY-lastY)*.004));
 lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener("pointerup",()=>lookOn=false);
renderer.domElement.addEventListener("pointercancel",()=>lookOn=false);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
