
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820">
<title>IZ PLAY - Battle Royale</title>
<style>
*{box-sizing:border-box;touch-action:none}
body{margin:0;background:#101820;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;gap:5px;pointer-events:none}
.stat{background:#101820dd;padding:9px 11px;border:1px solid #ffffff30;border-radius:10px;font-size:12px;font-weight:bold}
#controls{position:absolute;bottom:22px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}
#joy{width:125px;height:125px;border-radius:50%;background:#ffffff30;border:3px solid #ffffff80;position:relative}
#stick{width:46px;height:46px;background:#ffffffcc;border-radius:50%;position:absolute;left:36px;top:36px}
#fire{width:82px;height:82px;border-radius:50%;background:#df4435;border:4px solid #ffb3a9;color:white;font-size:17px;font-weight:bold}
#reload{width:58px;height:58px;border-radius:50%;background:#293b50;color:white;border:2px solid white}
#start{position:absolute;inset:0;background:linear-gradient(#09131aee,#10241eee);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.logo{font-size:45px;font-weight:1000;letter-spacing:3px;color:#ffcf43;text-shadow:0 0 25px #ff9b36}
#start h2{letter-spacing:4px}
#start p{color:#b9c8d2;line-height:1.6}
select{background:#182a38;color:white;border:1px solid #71889a;padding:13px;border-radius:10px;width:230px;margin:7px}
.mainbtn{background:linear-gradient(90deg,#f5a623,#e84c32);color:white;border:0;border-radius:12px;padding:16px 35px;font-size:17px;font-weight:bold;margin-top:15px}
#message{color:#ffda69;margin:10px}
#notice{position:absolute;top:75px;left:0;right:0;text-align:center;color:white;font-weight:bold;text-shadow:0 2px 5px black;pointer-events:none}
.hidden{display:none!important}
#bottomInfo{position:absolute;bottom:160px;right:15px;text-align:right;font-size:12px;text-shadow:0 2px 5px black;pointer-events:none}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
 <div class="stat">❤️ <span id="hp">100</span></div>
 <div class="stat">🔫 <span id="ammo">30</span>/30</div>
 <div class="stat">☠️ <span id="kills">0</span></div>
 <div class="stat">👥 <span id="alive">50</span></div>
</div>

<div id="notice"></div>
<div id="bottomInfo" class="hidden">
 <div>AK-47</div>
 <div id="zone">VÒNG BO AN TOÀN</div>
</div>

<div id="controls" class="hidden">
 <div id="joy"><div id="stick"></div></div>
 <div style="display:flex;align-items:end;gap:12px">
  <button id="reload">↻</button>
  <button id="fire">BẮN</button>
 </div>
</div>

<div id="start">
 <div class="logo">ｌｚ PLAY</div>
 <h2>BATTLE ROYALE</h2>
 <p>SINH TỒN • CHIẾN ĐẤU • CHIẾN THẮNG</p>
 <p>Chọn bản đồ chiến đấu</p>
 <select id="mapSelect">
  <option value="island">🏝️ Đảo Sinh Tồn</option>
  <option value="desert">🏜️ Sa Mạc</option>
  <option value="snow">❄️ Núi Tuyết</option>
 </select>
 <p>Chế độ: Người chơi + Bot</p>
 <p>Tối đa 50 nhân vật mỗi trận</p>
 <button class="mainbtn" id="play">BẮT ĐẦU CHIẾN ĐẤU</button>
 <div id="message">Sẵn sàng chưa, chiến binh?</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,dpr=1;
let running=false;
let player,bots=[],bullets=[],obstacles=[];
let kills=0,ammo=30,reloading=false;
let move={x:0,y:0};
let zone=1050,frame=0,lastShot=0;
let mapType="island";
let mapColor="#527c48";

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;
 canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

function random(min,max){return Math.random()*(max-min)+min}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function createMap(){
 obstacles=[];
 mapColor=mapType==="island"?"#527c48":mapType==="desert"?"#a98a55":"#a7bdc8";
 for(let i=0;i<55;i++){
  obstacles.push({
   x:random(-950,950),
   y:random(-950,950),
   w:random(45,110),
   h:random(45,110),
   type:Math.random()
  });
 }
}

function startGame(){
 mapType=document.getElementById("mapSelect").value;
 createMap();
 player={x:0,y:0,hp:100,angle:0};
 bots=[];bullets=[];
 kills=0;ammo=30;zone=1050;frame=0;
 reloading=false;
 // 1 người chơi + 49 bot = 50 nhân vật
 for(let i=0;i<49;i++){
  let angle=random(0,Math.PI*2);
  let d=random(300,950);
  bots.push({
   x:Math.cos(angle)*d,
   y:Math.sin(angle)*d,
   hp:100,
   speed:random(0.7,1.35),
   cooldown:random(20,100),
   wander:random(0,Math.PI*2),
   color:["#e74c3c","#d84f8a","#bd6b37"][i%3]
  });
 }
 document.getElementById("start").classList.add("hidden");
 document.getElementById("hud").classList.remove("hidden");
 document.getElementById("controls").classList.remove("hidden");
 document.getElementById("bottomInfo").classList.remove("hidden");
 document.getElementById("notice").textContent="BẮT ĐẦU! HÃY SINH TỒN!";
 running=true;
 updateHUD();
 requestAnimationFrame(loop);
}

function updateHUD(){
 document.getElementById("hp").textContent=Math.max(0,Math.ceil(player.hp));
 document.getElementById("ammo").textContent=ammo;
 document.getElementById("kills").textContent=kills;
 document.getElementById("alive").textContent=bots.length+1;
 document.getElementById("zone").textContent="BO: "+Math.round(zone);
}

function drawCharacter(x,y,color,angle,isPlayer=false){
 ctx.save();
 ctx.translate(x,y);
 // bóng
 ctx.fillStyle="#0005";
 ctx.beginPath();ctx.ellipse(0,13,17,7,0,0,Math.PI*2);ctx.fill();
 // chân
 ctx.fillStyle="#26313a";
 ctx.fillRect(-10,5,8,12);
 ctx.fillRect(3,5,8,12);
 // thân
 ctx.fillStyle=color;
 ctx.fillRect(-12,-12,24,23);
 // đầu
 ctx.fillStyle="#e9c29b";
 ctx.beginPath();ctx.arc(0,-18,9,0,Math.PI*2);ctx.fill();
 // súng
 ctx.rotate(angle);
 ctx.fillStyle="#171717";
 ctx.fillRect(7,-4,28,6);
 ctx.fillStyle="#777";
 ctx.fillRect(29,-3,8,4);
 ctx.restore();
}

function drawWorld(){
 let camX=player.x-W/2;
 let camY=player.y-H/2;
 ctx.fillStyle=mapColor;
 ctx.fillRect(0,0,W,H);

 // Cỏ, cát, tuyết
 ctx.strokeStyle=mapType==="snow"?"#ffffff25":"#ffffff12";
 ctx.lineWidth=1;
 for(let x=(-camX%70);x<W;x+=70){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=(-camY%70);y<H;y+=70){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }

 // Công trình
 obstacles.forEach(o=>{
  let x=o.x-camX,y=o.y-camY;
  if(x<-130||x>W+130||y<-130||y>H+130)return;
  ctx.fillStyle="#252c31";
  ctx.fillRect(x,y,o.w,o.h);
  ctx.fillStyle=mapType==="snow"?"#d6e2e8":"#9a8a6b";
  ctx.fillRect(x+5,y+5,o.w-10,o.h-10);
  ctx.fillStyle="#333";
  ctx.fillRect(x+o.w*.4,y+o.h*.4,o.w*.2,o.h*.2);
 });

 // Vòng bo
 ctx.strokeStyle="#4fc9ff";
 ctx.lineWidth=5;
 ctx.beginPath();
 ctx.arc(-camX,-camY,zone,0,Math.PI*2);
 ctx.stroke();

 // Vùng ngoài bo
 ctx.fillStyle="#2355aa18";
 ctx.beginPath();
 ctx.rect(0,0,W,H);
 ctx.arc(-camX,-camY,zone,0,Math.PI*2,true);
 ctx.fill("evenodd");

 // Đạn
 bullets.forEach(b=>{
  ctx.fillStyle=b.owner==="player"?"#ffe75a":"#ff7955";
  ctx.beginPath();
  ctx.arc(b.x-camX,b.y-camY,4,0,Math.PI*2);
  ctx.fill();
 });

 // Bot
 bots.forEach(b=>{
  drawCharacter(b.x-camX,b.y-camY,b.color,
   Math.atan2(player.y-b.y,player.x-b.x));
  ctx.fillStyle="#e33";
  ctx.fillRect(b.x-camX-15,b.y-camY-35,30,4);
  ctx.fillStyle="#5f5";
  ctx.fillRect(b.x-camX-15,b.y-camY-35,30*b.hp/100,4);
 });

 // Người chơi
 drawCharacter(W/2,H/2,"#258cff",player.angle,true);

 // tâm ngắm
 ctx.strokeStyle="white";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(W/2,H/2,12,0,Math.PI*2);
 ctx.moveTo(W/2-20,H/2);ctx.lineTo(W/2-7,H/2);
 ctx.moveTo(W/2+7,H/2);ctx.lineTo(W/2+20,H/2);
 ctx.moveTo(W/2,H/2-20);ctx.lineTo(W/2,H/2-7);
 ctx.moveTo(W/2,H/2+7);ctx.lineTo(W/2,H/2+20);
 ctx.stroke();
}

function shoot(){
 if(!running||ammo<=0||reloading)return;
 let now=Date.now();
 if(now-lastShot<230)return;
 lastShot=now;
 ammo--;
 let target=null,best=Infinity;
 bots.forEach(b=>{
  let d=distance(player,b);
  if(d<best){best=d;target=b;}
 });
 if(!target){updateHUD();return;}
 let dx=target.x-player.x,dy=target.y-player.y;
 let d=Math.hypot(dx,dy)||1;
 player.angle=Math.atan2(dy,dx);
 bullets.push({
  x:player.x+Math.cos(player.angle)*25,
  y:player.y+Math.sin(player.angle)*25,
  dx:dx/d,dy:dy/d,owner:"player",life:60,damage:35
 });
 updateHUD();
}

function reload(){
 if(reloading||ammo===30)return;
 reloading=true;
 document.getElementById("reload").textContent="...";
 setTimeout(()=>{
  ammo=30;reloading=false;
  document.getElementById("reload").textContent="↻";
  updateHUD();
 },1300);
}

function update(){
 frame++;
 // di chuyển
 player.x+=move.x*3.7;
 player.y+=move.y*3.7;
 player.x=Math.max(-1100,Math.min(1100,player.x));
 player.y=Math.max(-1100,Math.min(1100,player.y));

 // vòng bo thu nhỏ
 if(frame%50===0)zone=Math.max(180,zone-7);
 if(Math.hypot(player.x,player.y)>zone)player.hp-=0.16;

 // bot AI
 bots.forEach(b=>{
  let dx=player.x-b.x,dy=player.y-b.y;
  let d=Math.hypot(dx,dy)||1;
  b.cooldown--;

  if(d<550){
   let speed=b.speed;
   if(d>190){b.x+=dx/d*speed;b.y+=dy/d*speed;}
   else if(d<105){b.x-=dx/d*speed*.6;b.y-=dy/d*speed*.6;}
   if(d<450&&b.cooldown<=0){
    let a=Math.atan2(dy,dx)+random(-.16,.16);
    bullets.push({
     x:b.x,y:b.y,
     dx:Math.cos(a),dy:Math.sin(a),
     owner:"bot",life:45,damage:random(5,10)
    });
    b.cooldown=random(65,110);
   }
  }else{
   b.x+=Math.cos(b.wander)*b.speed*.5;
   b.y+=Math.sin(b.wander)*b.speed*.5;
   if(frame%100===0)b.wander=random(0,Math.PI*2);
  }
  if(Math.hypot(b.x,b.y)>zone)b.hp-=.08;
 });

 // đạn bay và va chạm
 bullets.forEach(b=>{
  b.x+=b.dx*11;
  b.y+=b.dy*11;
  b.life--;
  if(b.owner==="player"){
   bots.forEach(e=>{
    if(e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<20){
     e.hp-=b.damage;b.life=0;
    }
   });
  }else if(Math.hypot(player.x-b.x,player.y-b.y)<20){
   player.hp-=b.damage;b.life=0;
  }
 });
 bullets=bullets.filter(b=>b.life>0);

 let before=bots.length;
 bots=bots.filter(b=>b.hp>0);
 // Đếm bot bị người chơi hạ
 kills+=before-bots.length;
 updateHUD();

 if(player.hp<=0){endGame(false);return;}
 if(bots.length===0){endGame(true);return;}
}

function loop(){
 if(!running)return;
 update();
 drawWorld();
 if(running)requestAnimationFrame(loop);
}

function endGame(win){
 running=false;
 document.getElementById("start").classList.remove("hidden");
 document.getElementById("hud").classList.add("hidden");
 document.getElementById("controls").classList.add("hidden");
 document.getElementById("bottomInfo").classList.add("hidden");
 document.getElementById("start").querySelector("h2").textContent=
  win?"🏆 BOOYAH!":"💀 BẠN ĐÃ BỊ LOẠI";
 document.getElementById("message").textContent=
  "Hạ gục "+kills+" đối thủ!";
 document.getElementById("play").textContent="CHƠI LẠI";
 document.getElementById("notice").textContent="";
}

// Joystick cảm ứng
const joy=document.getElementById("joy");
const stick=document.getElementById("stick");
let joyActive=false;

function moveJoy(e){
 let r=joy.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 let d=Math.hypot(x,y),max=40;
 if(d>max){x=x/d*max;y=y/d*max;}
 move.x=x/max;move.y=y/max;
 if(Math.hypot(move.x,move.y)>.1)
  player.angle=Math.atan2(move.y,move.x);
 stick.style.left=(36+x)+"px";
 stick.style.top=(36+y)+"px";
}
joy.addEventListener("pointerdown",e=>{
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
});
joy.addEventListener("pointermove",e=>{
 if(joyActive)moveJoy(e);
});
function stopJoy(){
 joyActive=false;move={x:0,y:0};
 stick.style.left="36px";stick.style.top="36px";
}
joy.addEventListener("pointerup",stopJoy);
joy.addEventListener("pointercancel",stopJoy);

document.getElementById("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();shoot();
});
document.getElementById("reload").onclick=reload;
document.getElementById("play").onclick=startGame;

// Không cho iPhone cuộn trang khi chơi
document.addEventListener("contextmenu",e=>e.preventDefault());
</script>
</body>
</html>
